<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#6E56CF">
        <animate attributeName="offset" values="0;1;0" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#9B8CF0">
        <animate attributeName="offset" values="0.5;1;0.5" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#CFC6FF">
        <animate attributeName="offset" values="1;0;1" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#0f0f12" />

  <g filter="url(#shadow)">
    <rect x="60" y="40" rx="18" ry="18" width="1080" height="220" fill="url(#g)" opacity="0.12" />
  </g>

  <g>
    <text x="120" y="120" fill="#FFFFFF" font-size="36" font-family="Segoe UI, Roboto, sans-serif" font-weight="700">Karthick — Senior Technical Architect</text>
    <text x="120" y="160" fill="#E6E6F7" font-size="20" font-family="Segoe UI, Roboto, sans-serif">AI Infrastructure · LLM cost control · Reliable agent workflows · Reproducible releases</text>
  </g>

  <!-- floating circles -->
  <circle cx="1000" cy="60" r="30" fill="#6E56CF" opacity="0.18">
    <animateTransform attributeName="transform" attributeType="XML" type="translate" values="0 0; -20 8; 0 0" dur="6s" repeatCount="indefinite" />
  </circle>
  <circle cx="1100" cy="200" r="20" fill="#9B8CF0" opacity="0.12">
    <animateTransform attributeName="transform" attributeType="XML" type="translate" values="0 0; -10 -6; 0 0" dur="5s" repeatCount="indefinite" />
  </circle>

</svg>
