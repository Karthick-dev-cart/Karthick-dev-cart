  <defs>
    <linearGradient id="grad1" x1="0" x2="1">
      <stop offset="0%" stop-color="#6E56CF"><animate attributeName="offset" values="0;1;0" dur="4s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#9B8CF0" />
